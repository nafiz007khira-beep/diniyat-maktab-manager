name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          MAIN_ZIP="$(find . -type f -iname 'DiniyatMaktab_Mobile_APK_Build_v2-1.zip' -print -quit)"

          if [ -n "$MAIN_ZIP" ]; then
            unzip -o "$MAIN_ZIP" -d .
          fi

          APP_GRADLE="$(find . -type f -path '*/app/build.gradle' -print -quit)"

          if [ -z "$APP_GRADLE" ]; then
            INNER_ZIP="$(find . -type f \( -iname 'app-folder.zip' -o -iname 'app-foldar.zip' \) -print -quit)"
            if [ -n "$INNER_ZIP" ]; then
              unzip -o "$INNER_ZIP" -d .
            fi
          fi

          APP_GRADLE="$(find . -type f -path '*/app/build.gradle' -print -quit)"

          if [ -z "$APP_GRADLE" ]; then
            echo "ERROR: app/build.gradle not found"
            find . -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiniyatMaktab-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
